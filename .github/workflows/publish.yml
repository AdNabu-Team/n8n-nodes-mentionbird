# Publishes the package to npm, with a provenance statement, when a version
# tag is pushed. n8n requires community nodes to be published from GitHub
# Actions with provenance.
#
# The job runs in the `npm` environment, which admits only version tags and
# waits for a maintainer's approval. README → Publishing has the one-time
# setup and the release steps.

name: Publish

on:
  push:
    tags:
      # Version tags such as 0.1.0. A prerelease tag such as 2.0.0-rc.1 matches
      # too, and fails: npm publishes a prerelease only with --tag, which
      # `n8n-node release` doesn't pass.
      - '*.*.*'

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      # Mints the OIDC token npm uses for provenance and trusted publishing.
      id-token: write
      # Lets the checkout read the repository.
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          # A job that publishes restores nothing another workflow wrote.
          package-manager-cache: false

      # Dependencies' install scripts don't run; building needs none. Lint and
      # build still run their code in the Release step, which holds the token,
      # so this narrows that exposure rather than removing it.
      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: Release
        # `n8n-node release` lints, builds and runs `npm publish` with
        # provenance. npm signs in through trusted publishing once it's set up
        # for the package, and until then with the NPM_TOKEN secret, written
        # to .npmrc here.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
